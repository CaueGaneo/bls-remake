<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beyblade Ranking</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="bg-animations" aria-hidden="true">
    <div class="blade blade-1"></div>
    <div class="blade blade-2"></div>
    <div class="blade blade-3"></div>
    <div class="blade blade-4"></div>
  </div>

  <header>
    <div class="logo">⚡</div>
    <h1>BEYBLADE RANKING</h1>
    <p class="subtitle">Classificação Oficial dos Bladers</p>
  </header>

  <main>
    <div class="table-wrapper">
      <table id="ranking-table">
        <thead>
          <tr>
            <th>Ranking</th>
            <th>Nome</th>
            <th>Classificação</th>
            <th>RP</th>
            <th class="admin-only">Ações</th>
          </tr>
        </thead>
        <tbody id="players-body">
        </tbody>
      </table>
    </div>

    <div id="admin-panel" class="admin-panel hidden">
      <h2>Painel Administrador</h2>
      <form id="add-player-form">
        <input type="text" id="new-nome" placeholder="Nome do Blader" required maxlength="40" autocomplete="off">
        <input type="number" id="new-rp" placeholder="RP" required min="0" max="99999">
        <button type="submit" id="add-btn">Adicionar Jogador</button>
      </form>
      <p class="admin-hint">Edite Nome e RP diretamente na tabela e clique em Salvar. Use Excluir para remover.</p>
    </div>
  </main>

  <footer>
    <button id="adm-btn" type="button">ADM</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
